<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>스페인어 듣기</title><style>
:root{--bg:#f6f5f1;--surface:#fff;--ink:#18222e;--muted:#5d6670;--line:#e3e1da;--red:#b8232b;--gold:#c98a0c;--navy:#1d3a5c;--kr:#c0471f;--tint:#fbf3e4;--on:#fff}
@media (prefers-color-scheme: dark){:root{--bg:#12171d;--surface:#1a2129;--ink:#e9ecef;--muted:#9aa3ad;--line:#2b333d;--red:#ef5b60;--gold:#e7b44a;--navy:#9cc3f0;--kr:#ff9a6b;--tint:#2a2418;--on:#12171d;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:14px 16px 80px}
h1{font-size:15px;color:var(--red);margin:0 0 10px;letter-spacing:.02em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.es{font-size:28px;font-weight:800;color:var(--navy);line-height:1.25;text-wrap:balance}
.kr{font-size:19px;color:var(--kr);margin-top:4px}
.ko{font-size:16px;color:var(--muted)}
.vid{position:relative;aspect-ratio:16/9;max-width:100%;margin:14px 0 0;background:#000;border-radius:8px;overflow:hidden}
.vid iframe,.vid>div{position:absolute;inset:0;width:100%;height:100%}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
button,a.b{font:inherit;font-size:15px;padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none}
#play{background:var(--navy);border-color:var(--navy);color:var(--on);font-weight:700;font-size:18px;padding:12px 26px}
button[aria-pressed="true"]{background:var(--kr);border-color:var(--kr);color:var(--on)}
button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.msg{font-size:14px;color:var(--muted);margin:10px 0 0}
h2{font-size:15px;color:var(--red);border-top:2px solid var(--red);padding-top:10px;margin:26px 0 6px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.it{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);border-radius:0;padding:9px 12px;background:none}
.it:first-child{border-top:0}
.it b{color:var(--navy)} .it span{color:var(--muted);font-size:14px;margin-left:8px}
.it.on{background:var(--tint)}
.row{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.on{background:var(--tint)}
.who{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--on);margin-top:8px}
.wa{background:var(--red)} .wb{background:var(--gold)}
.pl{flex:none;width:44px;height:44px;border-radius:8px;padding:0;background:var(--navy);border-color:var(--navy);color:var(--on)}
.tx{min-width:0} .tx .e{font-weight:700;font-size:17px;color:var(--navy);line-height:1.35} .tx .k{color:var(--kr);font-size:15px} .tx .m{color:var(--muted);font-size:14.5px}
.dh{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:18px 0 6px}
.dh h3{font-size:16px;margin:0;flex:1 1 220px;color:var(--navy)}
.dh button{padding:6px 12px;font-size:14px}
nav{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
nav a{font-size:13px;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:2px 10px;background:var(--surface);color:var(--ink)}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 16px}
.bar .in{max-width:720px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar button{padding:5px 11px;font-size:13.5px}
body.hk .k, body.hm .m{color:transparent;background:var(--line);border-radius:4px}
</style></head><body><main>
<h1>바르셀로나 여행 스페인어 듣기</h1><div class="btns"><a class="b" href="p.html">영상 표현 104개 듣기</a><a class="b" href="d.html">대화 47편 듣기</a></div></main></body></html>
